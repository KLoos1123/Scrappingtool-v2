name: Dashboard publiceren

# Zet alleen het dashboard (web/) op GitHub Pages, zonder te scrapen. Draait
# vanzelf bij een wijziging aan de pagina's en kan handmatig gestart worden,
# zodat een nieuwe versie niet op de volgende scraper-run hoeft te wachten.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/*.html'
      - 'web/*.js'
      - 'web/*.png'
      - '.github/workflows/pages.yml'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publiceer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dashboard-data genereren
        run: python dashboard.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: web/ uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deployen naar Pages
        id: deployment
        uses: actions/deploy-pages@v4
