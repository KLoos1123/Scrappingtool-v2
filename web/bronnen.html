<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bronnen · Profource Marktmonitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Ontwerp: design_handoff_bronnen (Bronnen v3). Licht, zakelijk; opdrachten per bron
     staan centraal, de scraperstatus is bewust secundair (grijze/amber regel per bron). */
  :root{
    --pagina:#f2f4f7; --vlak:#ffffff; --kop:#fcfcfd; --tekst:#262b33; --muted:#5f656e; --muted2:#7a8089;
    --primair:#2f5fa8; --primair-donker:#244a86; --balk:#4a78c2; --balk-licht:#a9bde0; --balk-leeg:#eceef2;
    --op:#2f8a4e; --neer:#bf3b2c; --waarschuw:#8a6a2a; --waarschuw-bg:#fbf3e3;
    --rand:#d9dde3; --rand-veld:#c9ced6; --scheiding:#e8ebef; --kopregel:#f6f7f9;
    --actief:#e9eef8; --actief-tekst:#2d56a0; --gekozen:#eef2fa; --hover:#f4f6fb;
    /* namen die notities.js (gedeeld met het dashboard) verwacht */
    --border:var(--rand-veld); --bg2:#ffffff; --text:var(--tekst); --sub:var(--muted); --dim:#8a9099;
    --blauw:var(--primair); --blauw-l:var(--primair-donker);
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; background:var(--pagina); color:var(--tekst); font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:var(--primair); text-decoration:none; }
  a:hover{ color:var(--primair-donker); text-decoration:underline; }
  button{ font:inherit; }
  :focus-visible{ outline:2px solid var(--primair); outline-offset:2px; }
  .num{ font-variant-numeric:tabular-nums; }

  /* shell */
  .shell{ height:48px; display:flex; align-items:center; gap:16px; padding:0 16px; background:var(--kop); border-bottom:1px solid var(--rand); }
  .logo{ width:28px; height:28px; border-radius:6px; background:var(--primair); color:#fff; display:grid; place-items:center; font-weight:600; font-size:13px; }
  .shell .naam{ font-weight:600; font-size:15px; }
  .shell nav{ display:flex; gap:2px; margin-left:8px; font-size:14px; }
  .shell nav a, .shell nav span{ padding:6px 12px; border-radius:6px; color:#4a515c; white-space:nowrap; }
  .shell nav a:hover{ background:#f0f2f5; text-decoration:none; color:var(--tekst); }
  .shell nav .actief{ background:var(--actief); color:var(--actief-tekst); font-weight:500; }
  .shell .ruimte{ flex:1; }
  .gebruiker{ position:relative; }
  .initialen{ width:32px; height:32px; border-radius:50%; border:0; background:#dde5f3; color:var(--actief-tekst); font-size:12px; font-weight:600; cursor:pointer; }
  .menu{ position:absolute; right:0; top:40px; background:var(--vlak); border:1px solid var(--rand); border-radius:8px; box-shadow:0 8px 24px rgba(30,40,60,.12); padding:6px; min-width:200px; z-index:10; }
  .menu .wie{ font-size:12px; color:var(--muted); padding:6px 10px 8px; border-bottom:1px solid var(--scheiding); margin-bottom:4px; word-break:break-all; }
  .menu button{ width:100%; text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:6px; font-size:14px; cursor:pointer; color:var(--tekst); }
  .menu button:hover{ background:#f0f2f5; }

  /* paginakop */
  .kop{ background:var(--kop); border-bottom:1px solid var(--rand); padding:16px 32px 20px; }
  .kruimel{ font-size:13px; display:flex; gap:6px; color:var(--muted2); }
  .kop-rij{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px; margin-top:10px; }
  .kop h1{ margin:0; font-size:24px; font-weight:600; letter-spacing:-.01em; }
  .kop .onder{ font-size:14px; color:var(--muted2); margin-top:4px; }
  .cijfers{ display:flex; flex-wrap:wrap; gap:32px; }
  .cijfer{ display:flex; flex-direction:column; gap:4px; }
  .cijfer .l{ font-size:12px; color:var(--muted2); white-space:nowrap; }
  .cijfer .w{ display:flex; align-items:baseline; gap:8px; }
  .cijfer .w b{ font-size:28px; font-weight:500; line-height:1; }
  .trend{ font-size:13px; font-weight:500; white-space:nowrap; }
  .op{ color:var(--op); } .neer{ color:var(--neer); } .vlak{ color:var(--muted2); }

  /* filterbalk */
  .filters{ background:var(--kop); border-bottom:1px solid var(--rand); padding:14px 32px; display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px; }
  .veld{ display:flex; flex-direction:column; gap:6px; font-size:12px; color:#5a606a; }
  .veld input[type=search]{ font:inherit; font-size:14px; height:36px; padding:0 12px; border:1px solid var(--rand-veld); border-radius:6px; background:#fff; width:240px; outline:none; color:var(--tekst); }
  .veld input[type=search]:focus{ border-color:var(--primair); box-shadow:0 0 0 2px rgba(47,95,168,.15); }
  .segment{ display:flex; height:36px; border:1px solid var(--rand-veld); border-radius:6px; overflow:hidden; background:#fff; }
  .segment button{ font-size:14px; padding:0 14px; border:0; cursor:pointer; white-space:nowrap; background:#fff; color:var(--muted2); }
  .segment button + button{ border-left:1px solid var(--rand-veld); }
  .segment button[aria-pressed="true"]{ background:#e6edf9; color:var(--actief-tekst); }
  .schakel{ display:flex; align-items:center; gap:8px; height:36px; font-size:14px; cursor:pointer; white-space:nowrap; }
  .schakel input{ width:16px; height:16px; accent-color:var(--primair); }

  /* inhoud */
  main{ display:grid; grid-template-columns:minmax(0,1fr); gap:16px; padding:20px 32px 40px; align-items:start; }
  .kaart{ background:var(--vlak); border:1px solid var(--rand); border-radius:10px; overflow:hidden; min-width:0; }
  .werkbalk{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; border-bottom:1px solid var(--scheiding); }
  .werkbalk b{ font-weight:600; font-size:15px; }
  .werkbalk span{ font-size:12px; color:var(--muted2); }
  .scroll{ overflow-x:auto; }
  .tabel{ min-width:820px; }
  .rij{ display:grid; grid-template-columns:minmax(170px,1.6fr) minmax(130px,1fr) 96px 104px 76px 88px 72px; gap:16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--scheiding); font-size:14px; }
  .kopregel{ background:var(--kopregel); padding:10px 20px; font-size:12px; font-weight:500; color:#5a606a; }
  .kopregel button{ font-size:12px; font-weight:500; padding:0; border:0; background:transparent; cursor:pointer; display:flex; gap:4px; align-items:center; color:#5a606a; white-space:nowrap; }
  .kopregel button.r{ justify-content:flex-end; }
  .kopregel button[aria-sort]:not([aria-sort="none"]){ color:var(--tekst); }
  .data{ cursor:pointer; background:#fff; }
  .data:hover{ background:var(--hover); }
  .data.gekozen{ background:var(--gekozen); box-shadow:inset 3px 0 0 var(--primair); }
  .bron{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .bron b{ font-weight:500; color:var(--actief-tekst); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bron small{ font-size:12px; color:#8a9099; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bron small.let{ color:var(--waarschuw); }
  /* bijgewerkt: stip + moment van de laatste levering */
  .bijgewerkt{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); white-space:nowrap; }
  .bijgewerkt i{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--op); }
  .bijgewerkt.st-delay i{ background:#d39b2a; } .bijgewerkt.st-delay{ color:var(--waarschuw); }
  .bijgewerkt.st-stale i, .bijgewerkt.st-leeg i{ background:#c3c8d0; } .bijgewerkt.st-stale{ color:var(--waarschuw); } .bijgewerkt.st-leeg{ color:var(--muted2); }
  /* klein aandeelbalkje onder het aantal nieuw */
  .hoofd .mini{ display:block; width:56px; height:3px; margin:5px 0 0 auto; border-radius:2px; background:var(--balk-leeg); overflow:hidden; }
  .hoofd .mini b{ display:block; height:100%; background:var(--balk-licht); border-radius:2px; margin-left:auto; }
  .nieuwlabel{ display:inline-block; font-size:11px; font-weight:600; color:var(--primair); background:var(--actief); border-radius:10px; padding:1px 8px; }
  .snel{ font-weight:600; color:var(--neer); }
  .r{ text-align:right; }
  .hoofd{ font-size:16px; font-weight:600; }
  .klein{ font-size:13px; font-weight:500; }
  .grijs{ color:var(--muted2); }
  .leeg{ padding:48px 20px; text-align:center; color:var(--muted2); font-size:14px; }

  /* detail */
  .detail{ position:sticky; top:20px; }
  .detail-kop{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid var(--scheiding); }
  .detail-kop h2{ margin:0; font-size:20px; font-weight:600; }
  .detail-kop a{ font-size:13px; }
  .sluit{ font-size:18px; line-height:1; width:32px; height:32px; border:0; border-radius:6px; background:transparent; cursor:pointer; color:#5a606a; flex:none; }
  .sluit:hover{ background:#f0f2f5; }
  .vier{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--scheiding); border-bottom:1px solid var(--scheiding); }
  .vier div{ padding:14px 20px; background:#fff; display:flex; flex-direction:column; gap:4px; }
  .vier span{ font-size:12px; color:var(--muted2); }
  .vier b{ font-size:22px; font-weight:500; }
  .dagen{ padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .dagen h3{ margin:0; font-size:13px; font-weight:600; }
  .staven, .daglabels{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .staven{ align-items:end; height:120px; }
  .staaf{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%; }
  .staaf span{ font-size:11px; color:#5a606a; }
  .staaf i{ display:block; width:100%; border-radius:3px 3px 0 0; background:var(--balk-licht); }
  .staaf.vandaag i{ background:var(--primair); }
  .daglabels span{ text-align:center; font-size:11px; color:var(--muted2); }
  .let-op{ font-size:13px; color:var(--waarschuw); background:var(--waarschuw-bg); padding:10px 12px; border-radius:6px; }
  .naar{ font-size:14px; font-weight:500; margin-top:4px; }

  /* aanvragen van de gekozen bron */
  /* uitklaprij onder de gekozen bron: alle aanvragen van die bron */
  .uitklap{ border-bottom:1px solid var(--rand); background:#f7f9fc; box-shadow:inset 3px 0 0 var(--primair); padding:10px 20px 14px; }
  .akop{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; min-width:0; }
  .akop #aBron{ font-size:12px; color:var(--muted2); }
  .akop #aBron .let{ color:var(--waarschuw); }
  .aanvragen .sluit{ width:28px; height:28px; font-size:16px; }
  /* vaste hoogte met eigen scroll, zodat de andere bronnen in beeld blijven */
  .uitklap .aanvragen .scroll{ max-height:440px; overflow:auto; }
  .uitklap .arij.kopregel{ position:sticky; top:0; z-index:1; }
  .uitklap .aanvragen{ background:#fff; border:1px solid var(--rand); border-radius:8px; overflow:hidden; }
  .uitklap .aanvragen .werkbalk{ padding:10px 14px; }
  .uitklap .arij{ padding-left:14px; padding-right:14px; }
  .aanvragen .werkbalk{ flex-wrap:wrap; }
  .aanvragen .bediening{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .aanvragen input[type=search]{ font:inherit; font-size:14px; height:34px; padding:0 12px; border:1px solid var(--rand-veld); border-radius:6px; width:240px; outline:none; color:var(--tekst); }
  .aanvragen input[type=search]:focus{ border-color:var(--primair); box-shadow:0 0 0 2px rgba(47,95,168,.15); }
  .aanvragen select{ font:inherit; font-size:14px; height:34px; padding:0 8px; border:1px solid var(--rand-veld); border-radius:6px; background:#fff; color:var(--tekst); }
  .aanvragen .segment{ height:34px; }
  .aanvragen .telregel{ font-size:12px; color:var(--muted2); }
  .atabel{ min-width:900px; }
  .arij{ display:grid; grid-template-columns:minmax(260px,2.6fr) 116px 132px 150px 120px 20px; gap:14px; align-items:center; padding:7px 20px; border-bottom:1px solid var(--scheiding); font-size:14px; }
  .arij.kopregel{ padding:10px 20px; }
  /* filterkop: per kolom sorteren (klik op het label) en filteren (keuzelijst eronder) */
  .filterkop{ align-items:start; }
  .filterkop .kcel{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .filterkop .kcel.r{ align-items:flex-end; }
  .filterkop .kcel > button, .filterkop .kcel > span{ font-size:12px; font-weight:500; color:#5a606a; border:0; background:transparent; padding:0; cursor:pointer; display:flex; gap:4px; white-space:nowrap; }
  .filterkop .kcel > span{ cursor:default; }
  .filterkop .kcel > button[aria-sort]:not([aria-sort="none"]){ color:var(--tekst); }
  .aanvragen .filterkop select{ height:26px; font-size:12px; padding:0 4px; width:100%; max-width:240px; color:var(--muted); }
  .aanvragen .filterkop select.aan{ border-color:var(--primair); background:var(--actief); color:var(--actief-tekst); font-weight:500; }
  .wisfilters{ font-size:12px; color:var(--primair); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; }
  .arij.data:hover{ background:var(--hover); }
  .arij.open{ background:var(--gekozen); }
  .atitel{ min-width:0; }
  .atitel a{ font-weight:500; font-size:13.5px; }
  .atitel small{ display:block; font-size:11.5px; color:#8a9099; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .atitel .weg{ font-size:11px; color:var(--muted2); background:var(--kopregel); border:1px solid var(--rand); border-radius:999px; padding:0 7px; margin-left:6px; }
  .atitel .nieuw{ font-size:11px; color:#fff; background:var(--primair); border-radius:999px; padding:0 7px; margin-left:6px; }
  .dl small{ display:block; font-size:11px; font-weight:500; }
  .dl .kort{ color:var(--neer); } .dl .mid{ color:var(--waarschuw); } .dl .ver{ color:var(--muted2); }
  .wstatus{ font-size:12px; padding:2px 8px; border-radius:999px; background:var(--kopregel); border:1px solid var(--rand); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:inline-block; max-width:100%; }
  .adetail td, .adetail{ background:#fafbfc; }
  .adetail{ padding:12px 20px 4px; border-bottom:1px solid var(--scheiding); }
  .aanvragen .notitie{ background:#fff; border-color:var(--rand); }
  .aanvragen .notitie-opslaan{ color:#fff; }
  .meer{ display:block; margin:14px auto; font-size:14px; font-weight:500; padding:8px 16px; border-radius:6px; border:1px solid var(--rand-veld); background:#fff; color:var(--primair); cursor:pointer; }
  .meer:hover{ background:var(--hover); }
  .dashlink{ font-size:13px; font-weight:500; white-space:nowrap; }
  .laden, .fout{ padding:48px 32px; text-align:center; color:var(--muted2); }
  .fout{ color:var(--neer); }

  @media (max-width:1239px){
    .detail{ position:static; }
  }
  @media (max-width:640px){
    .aanvragen input[type=search]{ width:100%; }
    .aanvragen .bediening{ width:100%; }
    .kop, .filters{ padding-left:16px; padding-right:16px; }
    main{ padding:16px 16px 32px; }
    .uitklap{ padding:12px 12px 14px; }
    .shell nav{ margin-left:0; }
    .shell .naam{ display:none; }
    .veld input[type=search]{ width:100%; }
    .veld:first-child{ flex:1 1 100%; }
  }
</style>
</head>
<body>

<header class="shell">
  <div class="logo">P</div>
  <span class="naam">Marktmonitor</span>
  <nav>
    <a href="index.html">Dashboard</a>
    <span class="actief" aria-current="page">Bronnen</span>
    <a id="beheerLink" href="admin.html" hidden>Beheer</a>
  </nav>
  <span class="ruimte"></span>
  <div class="gebruiker">
    <button class="initialen" id="initialen" aria-haspopup="true" aria-expanded="false" title="Account">··</button>
    <div class="menu" id="menu" hidden>
      <div class="wie" id="wie"></div>
      <button onclick="logout()">Uitloggen</button>
    </div>
  </div>
</header>

<section class="kop">
  <div class="kruimel"><a href="index.html">Marktmonitor</a><span>/</span><span>Bronnen</span></div>
  <div class="kop-rij">
    <div>
      <h1>Opdrachten per bron</h1>
      <div class="onder" id="onder">Gegevens laden…</div>
    </div>
    <div class="cijfers">
      <div class="cijfer"><span class="l">Nieuw 7 dagen</span><div class="w"><b class="num" id="k7">—</b><span class="trend" id="kTrend"></span></div></div>
      <div class="cijfer"><span class="l">Nieuw 24 uur</span><div class="w"><b class="num" id="k24">—</b></div></div>
      <div class="cijfer"><span class="l">Nu open</span><div class="w"><b class="num" id="kOpen">—</b></div></div>
      <div class="cijfer"><span class="l">Totaal verzameld</span><div class="w"><b class="num" id="kTotaal">—</b></div></div>
    </div>
  </div>
</section>

<section class="filters">
  <label class="veld">Zoeken<input type="search" id="zoek" placeholder="Naam of domein" autocomplete="off"></label>
  <div class="veld">Periode
    <div class="segment" role="group" aria-label="Periode">
      <button data-periode="7d" aria-pressed="true">7 dagen</button>
      <button data-periode="24u" aria-pressed="false">24 uur</button>
    </div>
  </div>
  <label class="schakel"><input type="checkbox" id="actueel"> Alleen actuele bronnen</label>
</section>

<main id="main">
  <section class="kaart">
    <div class="werkbalk"><b id="telling">Bronnen</b><span>Klik op een bron voor al zijn aanvragen</span></div>
    <div class="scroll"><div class="tabel" id="tabel"><div class="laden">Bronnen laden…</div></div></div>
  </section>
</main>
<div id="bewaar" hidden>
  <div id="detail"></div>
  <section class="aanvragen" id="aanvragen">
    <div class="werkbalk">
      <div class="akop"><b id="aTitel">Aanvragen</b> <span class="telregel" id="aTelling"></span> <button class="wisfilters" id="aWis" hidden>filters wissen</button> <span id="aBron"></span></div>
      <div class="bediening">
        <input type="search" id="aZoek" placeholder="Zoek titel, organisatie, plaats of nummer" autocomplete="off" aria-label="Zoek in aanvragen">
        <div class="segment" role="group" aria-label="Welke aanvragen">
          <button data-open="1" aria-pressed="true">Nu open</button>
          <button data-open="0" aria-pressed="false">Alles</button>
        </div>
        <select id="aSort" aria-label="Sorteren">
          <option value="deadline">Deadline eerst</option>
          <option value="nieuw">Nieuwste eerst</option>
          <option value="titel">Titel A-Z</option>
          <option value="tarief">Hoogste tarief</option>
        </select>
        <a class="dashlink" id="aDash" href="index.html">Met alle filters in het dashboard →</a>
        <button class="sluit" id="aSluit" aria-label="Inklappen" title="Inklappen">×</button>
      </div>
    </div>
    <div class="scroll"><div class="atabel" id="aTabel"></div></div>
    <button class="meer" id="aMeer" hidden>Meer tonen</button>
  </section>
</div>

<script src="auth.js"></script>
<script src="notities.js"></script>
<script src="flappy.js"></script>
<script src="snake.js"></script>
<script>
// Alle bronnen die run.py scrapet (BRON in scrapers/*.py), met een leesbare naam
// en het domein waar de scraper leest. Een nieuwe bron verschijnt vanzelf zodra
// hij data heeft (met de BRON-code als naam).
const BRONNEN = {
  'freelance.nl':     ['Freelance.nl', 'freelance.nl'],
  'tenderned':        ['TenderNed', 'tenderned.nl'],
  'opdrachtoverheid': ['Opdrachtoverheid', 'opdrachtoverheid.nl'],
  'mercell':          ['Mercell', 's2c.mercell.com'],
  'flextender':       ['Flextender', 'flextender.nl'],
  'striive':          ['Striive (Vertage)', 'partner.vertage.com'],
  'magnit':           ['Magnit', 'portal.magnitglobal.com'],
  'ns':               ['NS', 'werkenbijns.nl'],
  'gelderland':       ['Werken in Gelderland', 'werkeningelderland.nl'],
  'hero':             ['Hero Interim', 'hero.eu'],
  'harveynash':       ['Harvey Nash', 'harveynash.nl'],
  'flexwestbrabant':  ['Flex West-Brabant', 'flexwestbrabant.nl'],
  'stedin':           ['Stedin', 'werkenbij.stedin.net'],
  'inhuurdesk-regio': ['Inhuurdesk regio', 'werkeninnoordoostbrabant.nl e.a.'],
  'heart':            ['HAErt', 'mijn.haert.nl'],
  'portofrotterdam':  ['Port of Rotterdam', 'portofrotterdamsso.my.site.com'],
  'staffingms':       ['StaffingMS', 'staffingdesk.my.site.com'],
  'stedin-vms':       ['Stedin VMS', 'stedin-vms.my.site.com'],
  'mipublic':         ['MiPublic', 'mipublic.nl'],
  'freep':            ['Freep', 'freep.nl'],
  'quest4':           ['Quest4', 'quest4.nl'],
  'publiekepartner':  ['De Publieke Partner', 'depubliekepartner.nl'],
  'inhuurdesk-alliander': ['Inhuurdesk Alliander', 'inhuurdeskalliander.nl'],
  'ns-vms':           ['NS VMS', 'inhuur-ns.my.site.com'],
  'alliander-vms':    ['Alliander VMS', 'alliander.my.site.com'],
};
const DAG = 86400000;
const RUN_MARGE = 2*3600000;        // rijen binnen 2 uur van de nieuwste run horen bij die run
const VERTRAAGD_GRENS = 36*3600000; // daarna telt een bron als 'geen recente data'
const PAGINA = 1000;
const WEEKDAG = ['zo','ma','di','wo','do','vr','za'];
const KOLOMMEN = [
  ['Bron','naam','l'], ['Bijgewerkt','bijgewerkt','l'], [null,'hoofd','r'],
  ['vs vorige week','trend','r'], ['Nu open','open','r'], ['Sluit ≤ 7d','snel','r'], ['Totaal','totaal','r'],
];

const state = { bronnen:[], laatsteRun:null, zoek:'', periode:'7d', actueel:false, sort:'hoofd', richting:-1, gekozen:null };

const nl = n => Number(n).toLocaleString('nl-NL');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms = iso => { if(!iso) return null; const t = new Date(iso).getTime(); return isNaN(t) ? null : t; };
function trendTekst(p){ return p > 0 ? `+${p}%` : p < 0 ? `−${Math.abs(p)}%` : '0%'; }
function trendKlas(p){ return p > 0 ? 'op' : p < 0 ? 'neer' : 'vlak'; }
function trendVan(nu, vorig){ return vorig ? Math.round((nu - vorig) / vorig * 100) : (nu ? 100 : 0); }
function begin(t){ const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }

// PostgREST geeft max 1000 rijen per call: eerst het totaal, dan parallel de rest.
async function haalAlles(select, bron){
  const pagina = (from, metTelling) => {
    let q = supabase.from('tenders').select(select, metTelling ? {count:'exact'} : undefined);
    if(bron) q = q.eq('bron', bron);
    return q.order('bron', {ascending:true}).order('tender_id', {ascending:true}).range(from, from + PAGINA - 1);
  };
  const rijenVan = res => { if(res.error) throw new Error(res.error.message); return res.data || []; };
  const eerste = await pagina(0, true);
  let uit = rijenVan(eerste);
  if(uit.length === PAGINA && eerste.count != null){
    const verzoeken = [];
    for(let from = PAGINA; from < eerste.count; from += PAGINA) verzoeken.push(pagina(from));
    for(const deel of (await Promise.all(verzoeken)).map(rijenVan)) uit = uit.concat(deel);
  }
  return uit;
}

async function laad(){
  const rijen = await haalAlles('bron, eerst_gezien, laatst_gezien, deadline');
  const nu = Date.now(), vandaag = begin(nu);
  let laatsteRun = null;
  rijen.forEach(r => { const t = ms(r.laatst_gezien); if(t != null && (laatsteRun == null || t > laatsteRun)) laatsteRun = t; });

  const leeg = code => ({ code, naam:(BRONNEN[code]||[code])[0], domein:(BRONNEN[code]||[])[1] || '',
    totaal:0, open:0, snel:0, n24:0, dagen:[0,0,0,0,0,0,0], vorige7:0, laatst:null });
  const per = new Map(Object.keys(BRONNEN).map(c => [c, leeg(c)]));
  rijen.forEach(r => {
    if(!r.bron) return;
    if(!per.has(r.bron)) per.set(r.bron, leeg(r.bron));
    const b = per.get(r.bron), eg = ms(r.eerst_gezien), lg = ms(r.laatst_gezien);
    b.totaal++;
    if(lg != null && (b.laatst == null || lg > b.laatst)) b.laatst = lg;
    // open = in de laatste run nog gezien én de deadline is niet voorbij (sommige
    // portalen, zoals Mercell, laten verlopen aanvragen nog weken staan)
    const dl = ms(r.deadline);
    if(lg != null && laatsteRun != null && lg >= laatsteRun - RUN_MARGE && (dl == null || dl >= vandaag)){
      b.open++;
      if(dl != null && dl >= nu && dl - nu <= 7 * DAG) b.snel++;   // open en sluit binnen een week
    }
    if(eg == null) return;
    if(nu - eg < DAG) b.n24++;
    // kalenderdagen: index 6 is vandaag, 0 is zes dagen terug; daarvoor de week ervoor
    const dagTerug = Math.floor((vandaag - begin(eg)) / DAG);
    if(dagTerug >= 0 && dagTerug < 7) b.dagen[6 - dagTerug]++;
    else if(dagTerug >= 7 && dagTerug < 14) b.vorige7++;
  });

  state.bronnen = [...per.values()].map(b => {
    const n7 = b.dagen.reduce((a, v) => a + v, 0);
    let status = 'ok';
    if(!b.totaal || b.laatst == null) status = 'leeg';
    else if(laatsteRun != null && b.laatst < laatsteRun - RUN_MARGE) status = (nu - b.laatst <= VERTRAAGD_GRENS) ? 'delay' : 'stale';
    return { ...b, n7, trend:trendVan(n7, b.vorige7), status };
  });
  state.laatsteRun = laatsteRun;
}

function subregel(b){ return [b.domein || b.code, false]; }
// "vandaag 12:53", "gisteren 18:02", "18 okt" (met stip in de kleur van de status)
function bijgewerkt(b){
  if(b.status === 'leeg' || b.laatst == null) return ['leeg', 'Nog geen data', 'Deze bron heeft nog niets aangeleverd'];
  const d = new Date(b.laatst), tijd = d.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
  const dagen = Math.round((begin(Date.now()) - begin(b.laatst)) / DAG);
  const wanneer = dagen === 0 ? `vandaag ${tijd}` : dagen === 1 ? `gisteren ${tijd}` : d.toLocaleDateString('nl-NL', {day:'numeric', month:'short'});
  const uitleg = { ok:'Leverde aanvragen in de laatste run', delay:'Ontbrak in de laatste run', stale:'Al langer geen aanvragen meer geleverd' }[b.status];
  return [b.status, b.status === 'ok' ? wanneer : (b.status === 'delay' ? 'Ontbrak · ' : 'Sinds ') + wanneer, uitleg];
}
function hoofdwaarde(b){ return state.periode === '24u' ? b.n24 : b.n7; }

function renderKop(){
  const som = k => state.bronnen.reduce((a, b) => a + b[k], 0);
  const n7 = som('n7'), vorig = som('vorige7'), t = trendVan(n7, vorig);
  document.getElementById('k7').textContent = nl(n7);
  const kt = document.getElementById('kTrend');
  kt.textContent = trendTekst(t); kt.className = 'trend ' + trendKlas(t);
  kt.title = `vorige week: ${nl(vorig)}`;
  document.getElementById('k24').textContent = nl(som('n24'));
  document.getElementById('kOpen').textContent = nl(som('open'));
  document.getElementById('kTotaal').textContent = nl(som('totaal'));
  let wanneer = '';
  if(state.laatsteRun){
    const d = new Date(state.laatsteRun), tijd = d.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
    const dagen = Math.round((begin(Date.now()) - begin(state.laatsteRun)) / DAG);
    wanneer = dagen === 0 ? `bijgewerkt vandaag ${tijd}` : dagen === 1 ? `bijgewerkt gisteren ${tijd}`
      : `bijgewerkt ${d.toLocaleDateString('nl-NL', {day:'numeric', month:'short'})} ${tijd}`;
  }
  document.getElementById('onder').textContent = `${state.bronnen.length} websites en brokers` + (wanneer ? ` · ${wanneer}` : '');
}

function zichtbareBronnen(){
  const q = state.zoek.trim().toLowerCase();
  const lijst = state.bronnen.filter(b => (!state.actueel || b.status === 'ok')
    && (!q || b.naam.toLowerCase().includes(q) || b.domein.toLowerCase().includes(q) || b.code.includes(q)));
  const sleutel = { naam:b => b.naam.toLowerCase(), bijgewerkt:b => b.laatst || 0, hoofd:hoofdwaarde,
    trend:b => (b.status === 'ok' && b.vorige7 ? b.trend : -Infinity), open:b => b.open, snel:b => b.snel, totaal:b => b.totaal };
  const k = sleutel[state.sort], richting = state.sort === 'naam' ? -state.richting : state.richting;
  return lijst.sort((a, b) => { const x = k(a), y = k(b); return (x > y ? 1 : x < y ? -1 : 0) * richting || b.totaal - a.totaal; });
}

function renderTabel(){
  const lijst = zichtbareBronnen();
  const maxHoofd = Math.max(1, ...state.bronnen.map(hoofdwaarde));
  document.getElementById('telling').textContent = `Bronnen (${lijst.length})`;
  const kop = KOLOMMEN.map(([label, k, uitlijn]) => {
    const tekst = label || (state.periode === '24u' ? 'Nieuw 24u' : 'Nieuw 7d');
    const actief = state.sort === k;
    const pijl = actief ? (state.richting < 0 ? '↓' : '↑') : '';
    return `<button class="${uitlijn}" data-sort="${k}" aria-sort="${actief ? (state.richting < 0 ? 'descending' : 'ascending') : 'none'}">${tekst}<span aria-hidden="true">${pijl}</span></button>`;
  }).join('');
  const rijen = lijst.map(b => {
    const [sub, let_] = subregel(b), h = hoofdwaarde(b), geen = b.status !== 'ok';
    const [bStatus, bTekst, bUitleg] = bijgewerkt(b);
    const trend = geen ? '<span class="grijs">—</span>'
      : (state.periode !== '24u' && !b.vorige7 && b.n7) ? '<span class="nieuwlabel" title="Vorige week nog geen aanvragen">nieuw</span>'
      : `<span class="${trendKlas(b.trend)}">${trendTekst(b.trend)}</span>`;
    return `<div class="rij data${state.gekozen === b.code ? ' gekozen' : ''}" data-code="${esc(b.code)}" tabindex="0" role="button" aria-label="${esc(b.naam)}, details">
      <div class="bron"><b>${esc(b.naam)}</b><small class="${let_ ? 'let' : ''}">${esc(sub)}</small></div>
      <div class="bijgewerkt st-${bStatus}" title="${esc(bUitleg)}"><i aria-hidden="true"></i>${esc(bTekst)}</div>
      <span class="r hoofd num">${h ? nl(h) : '—'}${h ? `<i class="mini" aria-hidden="true"><b style="width:${Math.max(6, h / maxHoofd * 100).toFixed(0)}%"></b></i>` : ''}</span>
      <span class="r klein num">${trend}</span>
      <span class="r num">${b.open ? nl(b.open) : '—'}</span>
      <span class="r num">${b.snel ? `<span class="snel" title="Open aanvragen met een deadline binnen 7 dagen (klik om ze te tonen)">${nl(b.snel)}</span>` : '<span class="grijs">—</span>'}</span>
      <span class="r num grijs">${nl(b.totaal)}</span>
    </div>${state.gekozen === b.code ? '<div class="uitklap" id="uitklap"></div>' : ''}`;
  }).join('');
  const tabel = document.getElementById('tabel');
  // detail en aanvragen eerst veilig wegzetten, anders verdwijnen ze met de oude tabel
  const bewaar = document.getElementById('bewaar');
  bewaar.append(document.getElementById('detail'), document.getElementById('aanvragen'));
  tabel.innerHTML = `<div class="rij kopregel">${kop}</div>` + (rijen || '<div class="leeg">Geen bronnen gevonden.</div>');
  const uitklap = document.getElementById('uitklap');
  if(uitklap) uitklap.append(document.getElementById('detail'), document.getElementById('aanvragen'));
  tabel.querySelectorAll('[data-sort]').forEach(knop => knop.onclick = () => {
    const k = knop.dataset.sort;
    state.richting = state.sort === k ? -state.richting : -1;
    state.sort = k;
    renderTabel();
  });
  tabel.querySelectorAll('.data').forEach(rij => {
    const kies = e => {
      // klik op het rode 'Sluit ≤ 7d'-getal: open de bron meteen met dat filter
      const snel = e && e.target.closest && e.target.closest('.snel');
      state.gekozen = state.gekozen === rij.dataset.code && !snel ? null : rij.dataset.code;
      state.startFilter = snel ? { deadline:'7' } : null;
      renderTabel(); renderDetail(); toonAanvragen();
      // de gekozen bron bovenaan in beeld, met zijn aanvragen eronder
      if(state.gekozen) document.querySelector('#tabel .data.gekozen')?.scrollIntoView({behavior:'smooth', block:'start'});
    };
    rij.onclick = kies;
    rij.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); kies(); } };
  });
}

function renderDetail(){
  // de cijfers staan al in de regel van de bron; hier alleen domein en een eventuele melding
  const b = state.bronnen.find(x => x.code === state.gekozen);
  const plek = document.getElementById('aBron');
  if(!b){ plek.innerHTML = ''; return; }
  const geen = b.status !== 'ok', [sub] = subregel(b);
  const domein = b.domein && !b.domein.includes(' ') ? `<a href="https://${esc(b.domein)}" target="_blank" rel="noopener">${esc(b.domein)} ↗</a>` : '';
  plek.innerHTML = [domein, geen ? `<span class="let">${esc(sub)}: cijfers mogelijk onvolledig</span>` : ''].filter(Boolean).join(' · ');
}


/* ===================== aanvragen van de gekozen bron ===================== */
const TOON_PER_KEER = 100;
const AANVRAGEN = new Map();   // bron -> rijen
const av = { open:true, zoek:'', sort:'deadline', omgekeerd:false, toon:TOON_PER_KEER, bron:null, opengeklapt:new Set(), f:{} };
const GEEN_FILTERS = { org:'', gezien:'', deadline:'', tarief:'', status:'' };
av.f = { ...GEEN_FILTERS };
// tarief en kenmerken komen uit notities.js (TARIEVEN, NOTITIES)
function tariefVan(r){ return (typeof TARIEVEN !== 'undefined' && TARIEVEN.get(notitieSleutel(r.bron, r.tender_id))) || null; }
function heeftTarief(r){
  const n = typeof NOTITIES !== 'undefined' && NOTITIES.get(notitieSleutel(r.bron, r.tender_id));
  const t = tariefVan(r);
  return !!((n && n.tarief) || (t && t.tarief));
}

function isOnline(r){ const t = ms(r.laatst_gezien); return t != null && state.laatsteRun != null && t >= state.laatsteRun - RUN_MARGE; }
// 'Nu open': nog op de site én deadline niet voorbij (vandaag telt nog mee)
function isOpen(r){ const d = ms(r.deadline); return isOnline(r) && (d == null || d >= begin(Date.now())); }
function datumKort(t){ return t == null ? '—' : new Date(t).toLocaleDateString('nl-NL', {day:'numeric', month:'short', year:'2-digit'}); }

async function laadAanvragen(bron){
  const rijen = await haalAlles('bron, tender_id, nummer, titel, organisatie, locatie, deadline, publicatiedatum, eerst_gezien, laatst_gezien, url, status', bron);
  AANVRAGEN.set(bron, rijen);
}

async function toonAanvragen(){
  const b = state.bronnen.find(x => x.code === state.gekozen);
  if(!b) return;
  if(av.bron !== b.code){
    // nieuwe bron: filters terug naar de standaard; zonder recente data direct alles tonen
    av.bron = b.code; av.zoek = ''; av.toon = TOON_PER_KEER; av.opengeklapt.clear(); av.f = { ...GEEN_FILTERS };
    av.open = b.status === 'ok';
    document.getElementById('aZoek').value = '';
    document.querySelectorAll('[data-open]').forEach(k => k.setAttribute('aria-pressed', String((k.dataset.open === '1') === av.open)));
  }
  if(state.startFilter){ av.f = { ...GEEN_FILTERS, ...state.startFilter }; av.open = true; state.startFilter = null;
    document.querySelectorAll('[data-open]').forEach(k => k.setAttribute('aria-pressed', String(k.dataset.open === '1'))); }
  document.getElementById('aTitel').textContent = `Aanvragen`;
  document.getElementById('aDash').href = `index.html?bron=${encodeURIComponent(b.code)}`;
  if(!AANVRAGEN.has(b.code)){
    document.getElementById('aTabel').innerHTML = '<div class="laden">Aanvragen laden…</div>';
    document.getElementById('aTelling').textContent = '';
    try{ await laadAanvragen(b.code); }
    catch(err){ document.getElementById('aTabel').innerHTML = `<div class="fout">Kon de aanvragen niet laden: ${esc(err.message || err)}</div>`; return; }
    if(state.gekozen !== b.code) return;
  }
  renderAanvragen();
}

// basis: open/alles en zoeken; de kolomfilters komen daarbovenop (zo blijven de keuzelijsten gevuld)
function basisAanvragen(){
  const q = av.zoek.trim().toLowerCase();
  return (AANVRAGEN.get(av.bron) || []).filter(r => (!av.open || isOpen(r))
    && (!q || [r.titel, r.organisatie, r.locatie, r.nummer].some(v => String(v || '').toLowerCase().includes(q))));
}
function voldoet(r, f, nu){
  if(f.org && (r.organisatie || '') !== f.org) return false;
  if(f.status && (r.status || '') !== f.status) return false;
  if(f.gezien){
    const eg = ms(r.eerst_gezien);
    const grens = f.gezien === 'vandaag' ? begin(nu) : nu - Number(f.gezien) * DAG;
    if(eg == null || eg < grens) return false;
  }
  if(f.deadline){
    const t = ms(r.deadline), vandaag = begin(nu);
    if(f.deadline === 'geen'){ if(t != null) return false; }
    else if(f.deadline === 'verlopen'){ if(t == null || t >= vandaag) return false; }
    else if(t == null || t < vandaag || t > nu + Number(f.deadline) * DAG) return false;
  }
  if(f.tarief){
    const t = tariefVan(r);
    if(f.tarief === 'met' && !heeftTarief(r)) return false;
    if(f.tarief === 'zzp' && !(t && t.contractvorm === 'ZZP mogelijk')) return false;
    if(f.tarief === 'deta' && !(t && t.contractvorm === 'Alleen detachering')) return false;
  }
  return true;
}
function gefilterdeAanvragen(){
  const nu = Date.now();
  const rijen = basisAanvragen().filter(r => voldoet(r, av.f, nu));
  const dl = r => { const t = ms(r.deadline); return t == null ? Infinity : (t < nu - DAG ? Infinity - 1 : t); };
  const tariefWaarde = r => { const t = tariefVan(r); return t ? (t.tarief_max || t.tarief_min || 0) : 0; };
  const sorteer = {
    deadline: (a, b) => dl(a) - dl(b) || (ms(b.eerst_gezien) || 0) - (ms(a.eerst_gezien) || 0),
    nieuw: (a, b) => (ms(b.eerst_gezien) || 0) - (ms(a.eerst_gezien) || 0),
    titel: (a, b) => String(a.titel || '').localeCompare(String(b.titel || ''), 'nl'),
    tarief: (a, b) => tariefWaarde(b) - tariefWaarde(a) || dl(a) - dl(b),
  }[av.sort];
  rijen.sort(sorteer);
  return av.omgekeerd ? rijen.reverse() : rijen;
}
function filterActief(){ return Object.values(av.f).some(Boolean); }

// kopregel met per kolom een sorteerknop en een keuzelijst
function filterKop(){
  const basis = basisAanvragen();
  const telling = veld => { const m = new Map(); basis.forEach(r => { const v = r[veld] || ''; if(v) m.set(v, (m.get(v) || 0) + 1); }); return [...m].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'nl')); };
  const opties = (sleutel, lijst) => `<select data-af="${sleutel}" class="${av.f[sleutel] ? 'aan' : ''}" aria-label="Filter">`
    + lijst.map(([waarde, label]) => `<option value="${esc(waarde)}"${av.f[sleutel] === waarde ? ' selected' : ''}>${esc(label)}</option>`).join('') + '</select>';
  const orgs = telling('organisatie');
  const orgLijst = [['', `Alle organisaties (${orgs.length})`], ...orgs.slice(0, 80).map(([o, n]) => [o, `${o} (${n})`])];
  if(av.f.org && !orgs.some(([o]) => o === av.f.org)) orgLijst.push([av.f.org, av.f.org]);
  const statussen = telling('status');
  const statusLijst = [['', 'Alle statussen'], ...statussen.map(([s_, n]) => [s_, `${s_} (${n})`])];
  const knop = (sleutel, label, standaardOmgekeerd) => {
    const actief = av.sort === sleutel;
    const pijl = actief ? (av.omgekeerd ? '↑' : '↓') : '';
    return `<button data-asort="${sleutel}" aria-sort="${actief ? (av.omgekeerd ? 'ascending' : 'descending') : 'none'}">${label}<span aria-hidden="true">${pijl}</span></button>`;
  };
  return `<div class="arij kopregel filterkop">
    <div class="kcel">${knop('titel', 'Aanvraag')}${opties('org', orgLijst)}</div>
    <div class="kcel">${knop('nieuw', 'Eerst gezien')}${opties('gezien', [['', 'Altijd'], ['vandaag', 'Vandaag'], ['7', 'Laatste 7 dagen'], ['30', 'Laatste 30 dagen']])}</div>
    <div class="kcel">${knop('deadline', 'Deadline')}${opties('deadline', [['', 'Alle deadlines'], ['7', 'Binnen 7 dagen'], ['21', 'Binnen 3 weken'], ['geen', 'Zonder deadline'], ['verlopen', 'Verlopen']])}</div>
    <div class="kcel r">${knop('tarief', 'Tarief')}${opties('tarief', [['', 'Alles'], ['met', 'Met tarief'], ['zzp', 'ZZP mogelijk'], ['deta', 'Alleen detachering']])}</div>
    <div class="kcel"><span>Status</span>${opties('status', statusLijst)}</div>
    <span></span>
  </div>`;
}

function deadlineCel(r){
  const t = ms(r.deadline);
  if(t == null) return '<span class="grijs">—</span>';
  const dagen = Math.floor((begin(t) - begin(Date.now())) / DAG);
  const [klas, tekst] = dagen < 0 ? ['ver', 'verlopen'] : dagen === 0 ? ['kort', 'sluit vandaag'] : dagen <= 7 ? ['kort', `nog ${dagen} d`] : dagen <= 21 ? ['mid', `nog ${dagen} d`] : ['ver', `nog ${dagen} d`];
  return `${datumKort(t)}<small class="${klas}">${tekst}</small>`;
}

function renderAanvragen(){
  const alle = AANVRAGEN.get(av.bron) || [];
  const rijen = gefilterdeAanvragen();
  document.getElementById('aTelling').textContent = `${nl(Math.min(av.toon, rijen.length))} van ${nl(rijen.length)}` + (rijen.length !== alle.length ? ` · ${nl(alle.length)} totaal` : '');
  const nu = Date.now();
  const kop = filterKop();
  document.getElementById('aWis').hidden = !filterActief();
  const regels = rijen.slice(0, av.toon).map(r => {
    const eg = ms(r.eerst_gezien), sleutel = `${r.tender_id}`;
    const titel = esc(r.titel || '(zonder titel)');
    const sub = [r.organisatie, r.locatie, r.nummer && r.nummer !== r.tender_id ? r.nummer : null].filter(Boolean).map(esc).join(' · ');
    const open = av.opengeklapt.has(sleutel);
    return `<div class="arij data${open ? ' open' : ''}" data-tid="${esc(r.tender_id)}" tabindex="0" role="button" aria-expanded="${open}" aria-label="${titel}: notitie">
        <div class="atitel">${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${titel}</a>` : `<b>${titel}</b>`}${eg != null && nu - eg < DAG ? '<span class="nieuw">nieuw</span>' : ''}${isOnline(r) ? '' : '<span class="weg">offline</span>'}${notitieIcoon(r.bron, r.tender_id)}<small>${sub || '&nbsp;'}</small></div>
        <span class="num">${datumKort(eg)}</span>
        <span class="dl num">${deadlineCel(r)}</span>
        <span class="r">${tariefCel(r.bron, r.tender_id)}</span>
        <span>${r.status ? `<span class="wstatus" title="${esc(r.status)}">${esc(r.status)}</span>` : '<span class="grijs">—</span>'}</span>
        <span aria-hidden="true" class="grijs">${open ? '▴' : '▾'}</span>
      </div>${open ? `<div class="adetail">${notitieHtml(r.bron, r.tender_id)}</div>` : ''}`;
  }).join('');
  const tabel = document.getElementById('aTabel');
  tabel.innerHTML = kop + (regels || '<div class="leeg">Geen aanvragen met deze filters.</div>');
  tabel.querySelectorAll('[data-af]').forEach(sel => sel.onchange = () => {
    av.f[sel.dataset.af] = sel.value; av.toon = TOON_PER_KEER; renderAanvragen();
    tabel.querySelector(`[data-af="${sel.dataset.af}"]`)?.focus();
  });
  tabel.querySelectorAll('[data-asort]').forEach(k => k.onclick = () => {
    if(av.sort === k.dataset.asort) av.omgekeerd = !av.omgekeerd;
    else { av.sort = k.dataset.asort; av.omgekeerd = false; }
    const sel = document.getElementById('aSort');
    if([...sel.options].some(o => o.value === av.sort)) sel.value = av.sort;
    renderAanvragen();
  });
  tabel.querySelectorAll('.arij.data').forEach(rij => {
    const wissel = () => {
      const tid = rij.dataset.tid;
      if(av.opengeklapt.has(tid)) av.opengeklapt.delete(tid); else av.opengeklapt.add(tid);
      renderAanvragen();
    };
    rij.onclick = e => { if(!e.target.closest('a')) wissel(); };
    rij.onkeydown = e => { if((e.key === 'Enter' || e.key === ' ') && e.target === rij){ e.preventDefault(); wissel(); } };
  });
  document.getElementById('aMeer').hidden = rijen.length <= av.toon;
}

// Na opslaan van een notitie alleen het icoon in die regel bijwerken (de notitie blijft open).
function werkNotitieIcoonBij(bron, tid){
  const rij = [...document.querySelectorAll('#aTabel .arij.data')].find(x => x.dataset.tid === tid);
  if(!rij) return;
  const cel = rij.querySelector('.atitel');
  cel.querySelector('.notitie-icoon')?.remove();
  cel.querySelector('small').insertAdjacentHTML('beforebegin', notitieIcoon(bron, tid));
}

document.getElementById('aZoek').oninput = e => { av.zoek = e.target.value; av.toon = TOON_PER_KEER; renderAanvragen(); };
document.querySelectorAll('[data-open]').forEach(knop => knop.onclick = () => {
  av.open = knop.dataset.open === '1'; av.toon = TOON_PER_KEER;
  document.querySelectorAll('[data-open]').forEach(k => k.setAttribute('aria-pressed', String(k === knop)));
  renderAanvragen();
});
document.getElementById('aSort').onchange = e => { av.sort = e.target.value; av.omgekeerd = false; renderAanvragen(); };
document.getElementById('aWis').onclick = () => { av.f = { ...GEEN_FILTERS }; av.toon = TOON_PER_KEER; renderAanvragen(); };
document.getElementById('aMeer').onclick = () => { av.toon += TOON_PER_KEER; renderAanvragen(); };
koppelNotities(document.getElementById('aanvragen'), werkNotitieIcoonBij);
document.getElementById('aSluit').onclick = () => { state.gekozen = null; renderTabel(); renderDetail(); toonAanvragen(); };
flappyMat.koppel(document.querySelector('.shell .logo'));
snakeMat.koppel(document.querySelector('.shell .logo'));

function render(){ renderKop(); renderTabel(); renderDetail(); toonAanvragen(); }

async function ververs(){
  if(bezigMetNotitie()) return; // niet verversen terwijl iemand een notitie typt
  try{
    await Promise.all([laad(), laadNotitiesEnTarieven()]);
    AANVRAGEN.clear();
    render();
  }
  catch(err){ console.error('verversen mislukt', err); } // stil: de oude cijfers blijven staan
}

document.getElementById('zoek').oninput = e => { state.zoek = e.target.value; renderTabel(); };
document.querySelectorAll('[data-periode]').forEach(knop => knop.onclick = () => {
  state.periode = knop.dataset.periode;
  document.querySelectorAll('[data-periode]').forEach(k => k.setAttribute('aria-pressed', String(k === knop)));
  renderTabel();
});
document.getElementById('actueel').onchange = e => { state.actueel = e.target.checked; renderTabel(); };
const initialen = document.getElementById('initialen'), menu = document.getElementById('menu');
initialen.onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; initialen.setAttribute('aria-expanded', String(!menu.hidden)); };
document.addEventListener('click', e => { if(!menu.hidden && !menu.contains(e.target)){ menu.hidden = true; initialen.setAttribute('aria-expanded', 'false'); } });

function initialenVan(email){
  const delen = (email || '').split('@')[0].split(/[._-]+/).filter(Boolean);
  if(!delen.length) return '?';
  return (delen.length > 1 ? delen[0][0] + delen[delen.length - 1][0] : delen[0].slice(0, 2)).toUpperCase();
}

(async () => {
  const me = await requireUser();
  if(!me) return; // requireUser heeft al doorgestuurd
  if(me.role === 'admin') document.getElementById('beheerLink').hidden = false;
  initialen.textContent = initialenVan(me.email);
  document.getElementById('wie').textContent = me.email || '';
  try{
    await Promise.all([laad(), laadNotitiesEnTarieven()]);
  }catch(err){
    document.getElementById('tabel').innerHTML = `<div class="fout">Kon de bronnen niet laden: ${esc(err.message || err)}</div>`;
    document.getElementById('onder').textContent = 'Laden mislukt';
    return;
  }
  render();
  volgNotities(null); // notities van collega's bijhouden; zichtbaar bij de volgende weergave
  setInterval(ververs, 5 * 60000);
})();
</script>
