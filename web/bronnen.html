<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bronnen · Profource Marktmonitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Ontwerp: design_handoff_bronnen (Bronnen v3). Licht, zakelijk; opdrachten per bron
     staan centraal, de scraperstatus is bewust secundair (grijze/amber regel per bron). */
  :root{
    --pagina:#f2f4f7; --vlak:#ffffff; --kop:#fcfcfd; --tekst:#262b33; --muted:#5f656e; --muted2:#7a8089;
    --primair:#2f5fa8; --primair-donker:#244a86; --balk:#4a78c2; --balk-licht:#a9bde0; --balk-leeg:#eceef2;
    --op:#2f8a4e; --neer:#bf3b2c; --waarschuw:#8a6a2a; --waarschuw-bg:#fbf3e3;
    --rand:#d9dde3; --rand-veld:#c9ced6; --scheiding:#e8ebef; --kopregel:#f6f7f9;
    --actief:#e9eef8; --actief-tekst:#2d56a0; --gekozen:#eef2fa; --hover:#f4f6fb;
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--pagina); color:var(--tekst); font-family:'IBM Plex Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:var(--primair); text-decoration:none; }
  a:hover{ color:var(--primair-donker); text-decoration:underline; }
  button{ font:inherit; }
  :focus-visible{ outline:2px solid var(--primair); outline-offset:2px; }
  .num{ font-variant-numeric:tabular-nums; }

  /* shell */
  .shell{ height:48px; display:flex; align-items:center; gap:16px; padding:0 16px; background:var(--kop); border-bottom:1px solid var(--rand); }
  .logo{ width:28px; height:28px; border-radius:6px; background:var(--primair); color:#fff; display:grid; place-items:center; font-weight:600; font-size:13px; }
  .shell .naam{ font-weight:600; font-size:15px; }
  .shell nav{ display:flex; gap:2px; margin-left:8px; font-size:14px; }
  .shell nav a, .shell nav span{ padding:6px 12px; border-radius:6px; color:#4a515c; white-space:nowrap; }
  .shell nav a:hover{ background:#f0f2f5; text-decoration:none; color:var(--tekst); }
  .shell nav .actief{ background:var(--actief); color:var(--actief-tekst); font-weight:500; }
  .shell .ruimte{ flex:1; }
  .gebruiker{ position:relative; }
  .initialen{ width:32px; height:32px; border-radius:50%; border:0; background:#dde5f3; color:var(--actief-tekst); font-size:12px; font-weight:600; cursor:pointer; }
  .menu{ position:absolute; right:0; top:40px; background:var(--vlak); border:1px solid var(--rand); border-radius:8px; box-shadow:0 8px 24px rgba(30,40,60,.12); padding:6px; min-width:200px; z-index:10; }
  .menu .wie{ font-size:12px; color:var(--muted); padding:6px 10px 8px; border-bottom:1px solid var(--scheiding); margin-bottom:4px; word-break:break-all; }
  .menu button{ width:100%; text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:6px; font-size:14px; cursor:pointer; color:var(--tekst); }
  .menu button:hover{ background:#f0f2f5; }

  /* paginakop */
  .kop{ background:var(--kop); border-bottom:1px solid var(--rand); padding:16px 32px 20px; }
  .kruimel{ font-size:13px; display:flex; gap:6px; color:var(--muted2); }
  .kop-rij{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px; margin-top:10px; }
  .kop h1{ margin:0; font-size:24px; font-weight:600; letter-spacing:-.01em; }
  .kop .onder{ font-size:14px; color:var(--muted2); margin-top:4px; }
  .cijfers{ display:flex; flex-wrap:wrap; gap:32px; }
  .cijfer{ display:flex; flex-direction:column; gap:4px; }
  .cijfer .l{ font-size:12px; color:var(--muted2); white-space:nowrap; }
  .cijfer .w{ display:flex; align-items:baseline; gap:8px; }
  .cijfer .w b{ font-size:28px; font-weight:500; line-height:1; }
  .trend{ font-size:13px; font-weight:500; white-space:nowrap; }
  .op{ color:var(--op); } .neer{ color:var(--neer); } .vlak{ color:var(--muted2); }

  /* filterbalk */
  .filters{ background:var(--kop); border-bottom:1px solid var(--rand); padding:14px 32px; display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px; }
  .veld{ display:flex; flex-direction:column; gap:6px; font-size:12px; color:#5a606a; }
  .veld input[type=search]{ font:inherit; font-size:14px; height:36px; padding:0 12px; border:1px solid var(--rand-veld); border-radius:6px; background:#fff; width:240px; outline:none; color:var(--tekst); }
  .veld input[type=search]:focus{ border-color:var(--primair); box-shadow:0 0 0 2px rgba(47,95,168,.15); }
  .segment{ display:flex; height:36px; border:1px solid var(--rand-veld); border-radius:6px; overflow:hidden; background:#fff; }
  .segment button{ font-size:14px; padding:0 14px; border:0; cursor:pointer; white-space:nowrap; background:#fff; color:var(--muted2); }
  .segment button + button{ border-left:1px solid var(--rand-veld); }
  .segment button[aria-pressed="true"]{ background:#e6edf9; color:var(--actief-tekst); }
  .schakel{ display:flex; align-items:center; gap:8px; height:36px; font-size:14px; cursor:pointer; white-space:nowrap; }
  .schakel input{ width:16px; height:16px; accent-color:var(--primair); }

  /* inhoud */
  main{ display:grid; grid-template-columns:minmax(0,1fr); gap:16px; padding:20px 32px 40px; align-items:start; }
  main.met-detail{ grid-template-columns:minmax(0,1fr) minmax(300px,380px); }
  .kaart{ background:var(--vlak); border:1px solid var(--rand); border-radius:10px; overflow:hidden; min-width:0; }
  .werkbalk{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; border-bottom:1px solid var(--scheiding); }
  .werkbalk b{ font-weight:600; font-size:15px; }
  .werkbalk span{ font-size:12px; color:var(--muted2); }
  .scroll{ overflow-x:auto; }
  .tabel{ min-width:820px; }
  .rij{ display:grid; grid-template-columns:minmax(170px,1.4fr) minmax(140px,1.2fr) 90px 110px 80px 80px; gap:16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--scheiding); font-size:14px; }
  .kopregel{ background:var(--kopregel); padding:10px 20px; font-size:12px; font-weight:500; color:#5a606a; }
  .kopregel button{ font-size:12px; font-weight:500; padding:0; border:0; background:transparent; cursor:pointer; display:flex; gap:4px; align-items:center; color:#5a606a; white-space:nowrap; }
  .kopregel button.r{ justify-content:flex-end; }
  .kopregel button[aria-sort]:not([aria-sort="none"]){ color:var(--tekst); }
  .data{ cursor:pointer; background:#fff; }
  .data:hover{ background:var(--hover); }
  .data.gekozen{ background:var(--gekozen); box-shadow:inset 3px 0 0 var(--primair); }
  .bron{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .bron b{ font-weight:500; color:var(--actief-tekst); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bron small{ font-size:12px; color:#8a9099; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bron small.let{ color:var(--waarschuw); }
  .aandeel{ display:flex; align-items:center; gap:10px; }
  .aandeel .spoor{ flex:1; height:6px; border-radius:3px; background:var(--balk-leeg); overflow:hidden; }
  .aandeel .spoor i{ display:block; height:100%; background:var(--balk); border-radius:3px; }
  .aandeel span{ font-size:12px; color:#5a606a; width:40px; text-align:right; }
  .r{ text-align:right; }
  .hoofd{ font-size:16px; font-weight:600; }
  .klein{ font-size:13px; font-weight:500; }
  .grijs{ color:var(--muted2); }
  .leeg{ padding:48px 20px; text-align:center; color:var(--muted2); font-size:14px; }

  /* detail */
  .detail{ position:sticky; top:20px; }
  .detail-kop{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid var(--scheiding); }
  .detail-kop h2{ margin:0; font-size:20px; font-weight:600; }
  .detail-kop a{ font-size:13px; }
  .sluit{ font-size:18px; line-height:1; width:32px; height:32px; border:0; border-radius:6px; background:transparent; cursor:pointer; color:#5a606a; flex:none; }
  .sluit:hover{ background:#f0f2f5; }
  .vier{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--scheiding); border-bottom:1px solid var(--scheiding); }
  .vier div{ padding:14px 20px; background:#fff; display:flex; flex-direction:column; gap:4px; }
  .vier span{ font-size:12px; color:var(--muted2); }
  .vier b{ font-size:22px; font-weight:500; }
  .dagen{ padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .dagen h3{ margin:0; font-size:13px; font-weight:600; }
  .staven, .daglabels{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .staven{ align-items:end; height:120px; }
  .staaf{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%; }
  .staaf span{ font-size:11px; color:#5a606a; }
  .staaf i{ display:block; width:100%; border-radius:3px 3px 0 0; background:var(--balk-licht); }
  .staaf.vandaag i{ background:var(--primair); }
  .daglabels span{ text-align:center; font-size:11px; color:var(--muted2); }
  .let-op{ font-size:13px; color:var(--waarschuw); background:var(--waarschuw-bg); padding:10px 12px; border-radius:6px; }
  .naar{ font-size:14px; font-weight:500; margin-top:4px; }
  .laden, .fout{ padding:48px 32px; text-align:center; color:var(--muted2); }
  .fout{ color:var(--neer); }

  @media (max-width:1239px){
    main.met-detail{ grid-template-columns:minmax(0,1fr); }
    .detail{ position:static; }
  }
  @media (max-width:640px){
    .kop, .filters{ padding-left:16px; padding-right:16px; }
    main{ padding:16px 16px 32px; }
    .shell nav{ margin-left:0; }
    .shell .naam{ display:none; }
    .veld input[type=search]{ width:100%; }
    .veld:first-child{ flex:1 1 100%; }
  }
</style>
</head>
<body>

<header class="shell">
  <div class="logo">P</div>
  <span class="naam">Marktmonitor</span>
  <nav>
    <a href="index.html">Dashboard</a>
    <span class="actief" aria-current="page">Bronnen</span>
    <a id="beheerLink" href="admin.html" hidden>Beheer</a>
  </nav>
  <span class="ruimte"></span>
  <div class="gebruiker">
    <button class="initialen" id="initialen" aria-haspopup="true" aria-expanded="false" title="Account">··</button>
    <div class="menu" id="menu" hidden>
      <div class="wie" id="wie"></div>
      <button onclick="logout()">Uitloggen</button>
    </div>
  </div>
</header>

<section class="kop">
  <div class="kruimel"><a href="index.html">Marktmonitor</a><span>/</span><span>Bronnen</span></div>
  <div class="kop-rij">
    <div>
      <h1>Opdrachten per bron</h1>
      <div class="onder" id="onder">Gegevens laden…</div>
    </div>
    <div class="cijfers">
      <div class="cijfer"><span class="l">Nieuw 7 dagen</span><div class="w"><b class="num" id="k7">—</b><span class="trend" id="kTrend"></span></div></div>
      <div class="cijfer"><span class="l">Nieuw 24 uur</span><div class="w"><b class="num" id="k24">—</b></div></div>
      <div class="cijfer"><span class="l">Nu open</span><div class="w"><b class="num" id="kOpen">—</b></div></div>
      <div class="cijfer"><span class="l">Totaal verzameld</span><div class="w"><b class="num" id="kTotaal">—</b></div></div>
    </div>
  </div>
</section>

<section class="filters">
  <label class="veld">Zoeken<input type="search" id="zoek" placeholder="Naam of domein" autocomplete="off"></label>
  <div class="veld">Periode
    <div class="segment" role="group" aria-label="Periode">
      <button data-periode="7d" aria-pressed="true">7 dagen</button>
      <button data-periode="24u" aria-pressed="false">24 uur</button>
    </div>
  </div>
  <label class="schakel"><input type="checkbox" id="actueel"> Alleen actuele bronnen</label>
</section>

<main id="main">
  <section class="kaart">
    <div class="werkbalk"><b id="telling">Bronnen</b><span>Klik op een rij voor details</span></div>
    <div class="scroll"><div class="tabel" id="tabel"><div class="laden">Bronnen laden…</div></div></div>
  </section>
  <aside class="kaart detail" id="detail" hidden></aside>
</main>

<script src="auth.js"></script>
<script>
// Alle bronnen die run.py scrapet (BRON in scrapers/*.py), met een leesbare naam
// en het domein waar de scraper leest. Een nieuwe bron verschijnt vanzelf zodra
// hij data heeft (met de BRON-code als naam).
const BRONNEN = {
  'freelance.nl':     ['Freelance.nl', 'freelance.nl'],
  'tenderned':        ['TenderNed', 'tenderned.nl'],
  'opdrachtoverheid': ['Opdrachtoverheid', 'opdrachtoverheid.nl'],
  'mercell':          ['Mercell', 's2c.mercell.com'],
  'flextender':       ['Flextender', 'flextender.nl'],
  'striive':          ['Striive (Vertage)', 'partner.vertage.com'],
  'magnit':           ['Magnit', 'portal.magnitglobal.com'],
  'ns':               ['NS', 'werkenbijns.nl'],
  'gelderland':       ['Werken in Gelderland', 'werkeningelderland.nl'],
  'hero':             ['Hero Interim', 'hero.eu'],
  'harveynash':       ['Harvey Nash', 'harveynash.nl'],
  'flexwestbrabant':  ['Flex West-Brabant', 'flexwestbrabant.nl'],
  'stedin':           ['Stedin', 'werkenbij.stedin.net'],
  'inhuurdesk-regio': ['Inhuurdesk regio', 'werkeninnoordoostbrabant.nl e.a.'],
  'heart':            ['HAErt', 'mijn.haert.nl'],
  'portofrotterdam':  ['Port of Rotterdam', 'portofrotterdamsso.my.site.com'],
  'staffingms':       ['StaffingMS', 'staffingdesk.my.site.com'],
  'stedin-vms':       ['Stedin VMS', 'stedin-vms.my.site.com'],
};
const DAG = 86400000;
const RUN_MARGE = 2*3600000;        // rijen binnen 2 uur van de nieuwste run horen bij die run
const VERTRAAGD_GRENS = 36*3600000; // daarna telt een bron als 'geen recente data'
const PAGINA = 1000;
const WEEKDAG = ['zo','ma','di','wo','do','vr','za'];
const KOLOMMEN = [
  ['Bron','naam','l'], ['Aandeel','aandeel','l'], [null,'hoofd','r'],
  ['vs vorige week','trend','r'], ['Nu open','open','r'], ['Totaal','totaal','r'],
];

const state = { bronnen:[], laatsteRun:null, zoek:'', periode:'7d', actueel:false, sort:'hoofd', richting:-1, gekozen:null };

const nl = n => Number(n).toLocaleString('nl-NL');
const pct = x => `${x.toFixed(1).replace('.', ',')}%`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms = iso => { if(!iso) return null; const t = new Date(iso).getTime(); return isNaN(t) ? null : t; };
function trendTekst(p){ return p > 0 ? `+${p}%` : p < 0 ? `−${Math.abs(p)}%` : '0%'; }
function trendKlas(p){ return p > 0 ? 'op' : p < 0 ? 'neer' : 'vlak'; }
function trendVan(nu, vorig){ return vorig ? Math.round((nu - vorig) / vorig * 100) : (nu ? 100 : 0); }
function begin(t){ const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }

// PostgREST geeft max 1000 rijen per call: eerst het totaal, dan parallel de rest.
async function haalAlles(select){
  const pagina = (from, metTelling) => supabase.from('tenders').select(select, metTelling ? {count:'exact'} : undefined)
    .order('bron', {ascending:true}).order('tender_id', {ascending:true}).range(from, from + PAGINA - 1);
  const rijenVan = res => { if(res.error) throw new Error(res.error.message); return res.data || []; };
  const eerste = await pagina(0, true);
  let uit = rijenVan(eerste);
  if(uit.length === PAGINA && eerste.count != null){
    const verzoeken = [];
    for(let from = PAGINA; from < eerste.count; from += PAGINA) verzoeken.push(pagina(from));
    for(const deel of (await Promise.all(verzoeken)).map(rijenVan)) uit = uit.concat(deel);
  }
  return uit;
}

async function laad(){
  const rijen = await haalAlles('bron, eerst_gezien, laatst_gezien');
  const nu = Date.now(), vandaag = begin(nu);
  let laatsteRun = null;
  rijen.forEach(r => { const t = ms(r.laatst_gezien); if(t != null && (laatsteRun == null || t > laatsteRun)) laatsteRun = t; });

  const leeg = code => ({ code, naam:(BRONNEN[code]||[code])[0], domein:(BRONNEN[code]||[])[1] || '',
    totaal:0, open:0, n24:0, dagen:[0,0,0,0,0,0,0], vorige7:0, laatst:null });
  const per = new Map(Object.keys(BRONNEN).map(c => [c, leeg(c)]));
  rijen.forEach(r => {
    if(!r.bron) return;
    if(!per.has(r.bron)) per.set(r.bron, leeg(r.bron));
    const b = per.get(r.bron), eg = ms(r.eerst_gezien), lg = ms(r.laatst_gezien);
    b.totaal++;
    if(lg != null && (b.laatst == null || lg > b.laatst)) b.laatst = lg;
    if(lg != null && laatsteRun != null && lg >= laatsteRun - RUN_MARGE) b.open++;
    if(eg == null) return;
    if(nu - eg < DAG) b.n24++;
    // kalenderdagen: index 6 is vandaag, 0 is zes dagen terug; daarvoor de week ervoor
    const dagTerug = Math.floor((vandaag - begin(eg)) / DAG);
    if(dagTerug >= 0 && dagTerug < 7) b.dagen[6 - dagTerug]++;
    else if(dagTerug >= 7 && dagTerug < 14) b.vorige7++;
  });

  state.bronnen = [...per.values()].map(b => {
    const n7 = b.dagen.reduce((a, v) => a + v, 0);
    let status = 'ok';
    if(!b.totaal || b.laatst == null) status = 'leeg';
    else if(laatsteRun != null && b.laatst < laatsteRun - RUN_MARGE) status = (nu - b.laatst <= VERTRAAGD_GRENS) ? 'delay' : 'stale';
    return { ...b, n7, trend:trendVan(n7, b.vorige7), status };
  });
  state.laatsteRun = laatsteRun;
}

function subregel(b){
  if(b.status === 'stale') return ['Geen recente data', true];
  if(b.status === 'delay') return ['Laatste update ontbreekt', true];
  if(b.status === 'leeg') return ['Nog geen data', true];
  return [b.domein, false];
}
function hoofdwaarde(b){ return state.periode === '24u' ? b.n24 : b.n7; }

function renderKop(){
  const som = k => state.bronnen.reduce((a, b) => a + b[k], 0);
  const n7 = som('n7'), vorig = som('vorige7'), t = trendVan(n7, vorig);
  document.getElementById('k7').textContent = nl(n7);
  const kt = document.getElementById('kTrend');
  kt.textContent = trendTekst(t); kt.className = 'trend ' + trendKlas(t);
  kt.title = `vorige week: ${nl(vorig)}`;
  document.getElementById('k24').textContent = nl(som('n24'));
  document.getElementById('kOpen').textContent = nl(som('open'));
  document.getElementById('kTotaal').textContent = nl(som('totaal'));
  let wanneer = '';
  if(state.laatsteRun){
    const d = new Date(state.laatsteRun), tijd = d.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
    const dagen = Math.round((begin(Date.now()) - begin(state.laatsteRun)) / DAG);
    wanneer = dagen === 0 ? `bijgewerkt vandaag ${tijd}` : dagen === 1 ? `bijgewerkt gisteren ${tijd}`
      : `bijgewerkt ${d.toLocaleDateString('nl-NL', {day:'numeric', month:'short'})} ${tijd}`;
  }
  document.getElementById('onder').textContent = `${state.bronnen.length} websites en brokers` + (wanneer ? ` · ${wanneer}` : '');
}

function zichtbareBronnen(){
  const q = state.zoek.trim().toLowerCase();
  const lijst = state.bronnen.filter(b => (!state.actueel || b.status === 'ok')
    && (!q || b.naam.toLowerCase().includes(q) || b.domein.toLowerCase().includes(q) || b.code.includes(q)));
  const sleutel = { naam:b => b.naam.toLowerCase(), aandeel:hoofdwaarde, hoofd:hoofdwaarde,
    trend:b => (b.status === 'ok' ? b.trend : -Infinity), open:b => b.open, totaal:b => b.totaal };
  const k = sleutel[state.sort], richting = state.sort === 'naam' ? -state.richting : state.richting;
  return lijst.sort((a, b) => { const x = k(a), y = k(b); return (x > y ? 1 : x < y ? -1 : 0) * richting || b.totaal - a.totaal; });
}

function renderTabel(){
  const lijst = zichtbareBronnen();
  const maxHoofd = Math.max(1, ...state.bronnen.map(hoofdwaarde));
  const totHoofd = state.bronnen.reduce((a, b) => a + hoofdwaarde(b), 0);
  document.getElementById('telling').textContent = `Bronnen (${lijst.length})`;
  const kop = KOLOMMEN.map(([label, k, uitlijn]) => {
    const tekst = label || (state.periode === '24u' ? 'Nieuw 24u' : 'Nieuw 7d');
    const actief = state.sort === k;
    const pijl = actief ? (state.richting < 0 ? '↓' : '↑') : '';
    return `<button class="${uitlijn}" data-sort="${k}" aria-sort="${actief ? (state.richting < 0 ? 'descending' : 'ascending') : 'none'}">${tekst}<span aria-hidden="true">${pijl}</span></button>`;
  }).join('');
  const rijen = lijst.map(b => {
    const [sub, let_] = subregel(b), h = hoofdwaarde(b), geen = b.status !== 'ok';
    return `<div class="rij data${state.gekozen === b.code ? ' gekozen' : ''}" data-code="${esc(b.code)}" tabindex="0" role="button" aria-label="${esc(b.naam)}, details">
      <div class="bron"><b>${esc(b.naam)}</b><small class="${let_ ? 'let' : ''}">${esc(sub)}</small></div>
      <div class="aandeel"><div class="spoor"><i style="width:${(h / maxHoofd * 100).toFixed(1)}%"></i></div><span class="num">${h ? pct(h / totHoofd * 100) : '—'}</span></div>
      <span class="r hoofd num">${h ? nl(h) : '—'}</span>
      <span class="r klein num ${geen ? 'grijs' : trendKlas(b.trend)}">${geen ? '—' : trendTekst(b.trend)}</span>
      <span class="r num">${b.open ? nl(b.open) : '—'}</span>
      <span class="r num grijs">${nl(b.totaal)}</span>
    </div>`;
  }).join('');
  const tabel = document.getElementById('tabel');
  tabel.innerHTML = `<div class="rij kopregel">${kop}</div>` + (rijen || '<div class="leeg">Geen bronnen gevonden.</div>');
  tabel.querySelectorAll('[data-sort]').forEach(knop => knop.onclick = () => {
    const k = knop.dataset.sort;
    state.richting = state.sort === k ? -state.richting : -1;
    state.sort = k;
    renderTabel();
  });
  tabel.querySelectorAll('.data').forEach(rij => {
    const kies = () => {
      state.gekozen = state.gekozen === rij.dataset.code ? null : rij.dataset.code;
      renderTabel(); renderDetail();
      // onder 1240px staat het detail onder de tabel: breng het in beeld
      if(state.gekozen && window.innerWidth < 1240) document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'start'});
    };
    rij.onclick = kies;
    rij.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); kies(); } };
  });
}

function renderDetail(){
  const paneel = document.getElementById('detail'), main = document.getElementById('main');
  const b = state.bronnen.find(x => x.code === state.gekozen);
  paneel.hidden = !b;
  main.classList.toggle('met-detail', !!b);
  if(!b) return;
  const tot7 = state.bronnen.reduce((a, x) => a + x.n7, 0);
  const geen = b.status !== 'ok', [sub] = subregel(b);
  const max = Math.max(1, ...b.dagen);
  const vandaag = new Date(); vandaag.setHours(12,0,0,0);
  const labels = b.dagen.map((_, i) => WEEKDAG[new Date(vandaag.getTime() - (6 - i) * DAG).getDay()]);
  const domeinLink = b.domein && !b.domein.includes(' ') ? `<a href="https://${esc(b.domein)}" target="_blank" rel="noopener">${esc(b.domein)}</a>` : `<span class="grijs" style="font-size:13px">${esc(b.domein)}</span>`;
  paneel.innerHTML = `
    <div class="detail-kop"><div style="min-width:0"><h2>${esc(b.naam)}</h2>${domeinLink}</div>
      <button class="sluit" id="sluit" aria-label="Sluiten">×</button></div>
    <div class="vier">
      <div><span>Nieuw 7 dagen</span><b class="num">${nl(b.n7)}</b></div>
      <div><span>vs vorige week</span><b class="num ${geen ? 'grijs' : trendKlas(b.trend)}" title="vorige week: ${nl(b.vorige7)}">${geen ? '—' : trendTekst(b.trend)}</b></div>
      <div><span>Marktaandeel 7d</span><b class="num">${pct(tot7 ? b.n7 / tot7 * 100 : 0)}</b></div>
      <div><span>Nu open</span><b class="num">${nl(b.open)}</b></div>
    </div>
    <div class="dagen">
      <h3>Nieuwe opdrachten per dag</h3>
      <div class="staven">${b.dagen.map((v, i) => `<div class="staaf${i === 6 ? ' vandaag' : ''}"><span class="num">${v}</span><i style="height:${Math.max(2, Math.round(v / max * 96))}px"></i></div>`).join('')}</div>
      <div class="daglabels">${labels.map(l => `<span>${l}</span>`).join('')}</div>
      ${geen ? `<span class="let-op">${esc(sub)}: cijfers zijn mogelijk onvolledig.</span>` : ''}
      <a class="naar" href="index.html?bron=${encodeURIComponent(b.code)}">Bekijk opdrachten van ${esc(b.naam)} →</a>
    </div>`;
  document.getElementById('sluit').onclick = () => { state.gekozen = null; renderTabel(); renderDetail(); };
}

function render(){ renderKop(); renderTabel(); renderDetail(); }

async function ververs(){
  try{ await laad(); render(); }
  catch(err){ console.error('verversen mislukt', err); } // stil: de oude cijfers blijven staan
}

document.getElementById('zoek').oninput = e => { state.zoek = e.target.value; renderTabel(); };
document.querySelectorAll('[data-periode]').forEach(knop => knop.onclick = () => {
  state.periode = knop.dataset.periode;
  document.querySelectorAll('[data-periode]').forEach(k => k.setAttribute('aria-pressed', String(k === knop)));
  renderTabel();
});
document.getElementById('actueel').onchange = e => { state.actueel = e.target.checked; renderTabel(); };
const initialen = document.getElementById('initialen'), menu = document.getElementById('menu');
initialen.onclick = e => { e.stopPropagation(); menu.hidden = !menu.hidden; initialen.setAttribute('aria-expanded', String(!menu.hidden)); };
document.addEventListener('click', e => { if(!menu.hidden && !menu.contains(e.target)){ menu.hidden = true; initialen.setAttribute('aria-expanded', 'false'); } });

function initialenVan(email){
  const delen = (email || '').split('@')[0].split(/[._-]+/).filter(Boolean);
  if(!delen.length) return '?';
  return (delen.length > 1 ? delen[0][0] + delen[delen.length - 1][0] : delen[0].slice(0, 2)).toUpperCase();
}

(async () => {
  const me = await requireUser();
  if(!me) return; // requireUser heeft al doorgestuurd
  if(me.role === 'admin') document.getElementById('beheerLink').hidden = false;
  initialen.textContent = initialenVan(me.email);
  document.getElementById('wie').textContent = me.email || '';
  try{
    await laad();
  }catch(err){
    document.getElementById('tabel').innerHTML = `<div class="fout">Kon de bronnen niet laden: ${esc(err.message || err)}</div>`;
    document.getElementById('onder').textContent = 'Laden mislukt';
    return;
  }
  // standaard de grootste bron open, zoals in het ontwerp
  state.gekozen = zichtbareBronnen()[0]?.code || null;
  render();
  setInterval(ververs, 5 * 60000);
})();
</script>
</body>
