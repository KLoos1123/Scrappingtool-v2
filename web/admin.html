<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beheer · Profource Marktmonitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg1:#101b28; --bg2:#14212f; --bg3:#192738;
    --panel:#1b2b3d; --panel2:#22344a; --border:#2a3a4d;
    --blauw:#199DD9; --blauw-l:#4ab8e6; --magenta:#E9167D;
    --text:#eef3f8; --sub:#cfe0f0; --muted:#8ea2b8; --dim:#5f7690;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; font-family:'IBM Plex Sans',sans-serif; color:var(--text);
    background:
      radial-gradient(1200px circle at 88% -8%, rgba(25,157,217,0.14), transparent 55%),
      radial-gradient(900px circle at -5% 8%, rgba(17,68,141,0.20), transparent 55%),
      linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
    background-attachment:fixed; padding:28px 32px 60px; }
  h1{ font-family:'Archivo',sans-serif; font-size:16px; margin:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding-bottom:20px;
    margin-bottom:24px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .topbar a, .topbar button{ font-size:12px; padding:8px 16px; border-radius:8px; cursor:pointer;
    border:1px solid rgba(25,157,217,0.4); background:rgba(25,157,217,0.10); color:var(--blauw);
    font-weight:600; text-decoration:none; font-family:inherit; }
  .topbar a:hover, .topbar button:hover{ background:rgba(25,157,217,0.18); }
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:20px; }
  .panel h2{ font-size:14px; margin:0 0 14px; }
  .keyform{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button.action{ font-size:12px; font-weight:600; padding:9px 16px; border-radius:8px; border:none;
    background:var(--blauw); color:#08151f; cursor:pointer; }
  button.action:hover{ background:var(--blauw-l); }
  .newkey{ font-family:monospace; font-size:13px; background:var(--bg2); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; color:#9fc4ec; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; padding:8px 10px; color:var(--muted); font-weight:600; font-size:11px;
    text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--border); }
  td{ padding:8px 10px; border-bottom:1px solid rgba(255,255,255,0.05); }
  .badge{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge-active{ background:rgba(25,157,217,0.16); color:var(--blauw); }
  .badge-blocked{ background:rgba(233,22,125,0.16); color:var(--magenta); }
  .badge-admin{ background:rgba(131,0,125,0.22); color:#d79ad4; }
  .badge-user{ background:rgba(255,255,255,0.06); color:var(--muted); }
  button.toggle{ font-size:11.5px; padding:6px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg2); color:var(--sub); cursor:pointer; }
  button.toggle:hover{ border-color:var(--blauw); }
  .muted{ color:var(--dim); font-size:12px; }
  .loading{ padding:30px; text-align:center; color:var(--muted); }
</style>
</head>
<body>

<div class="topbar">
  <h1>Beheer · Profource Marktmonitor</h1>
  <div style="display:flex;gap:10px;">
    <a href="index.html">Naar dashboard</a>
    <button onclick="logout()">Uitloggen</button>
  </div>
</div>

<div id="loading" class="loading">Laden...</div>

<div id="app" style="display:none">
  <div class="panel">
    <h2>Registratiesleutel genereren</h2>
    <div class="keyform">
      <button class="action" id="genBtn">Nieuwe sleutel genereren</button>
      <span id="newKeyBox"></span>
    </div>
    <div class="muted" style="margin-top:10px">Geef de gegenereerde sleutel aan de nieuwe gebruiker. Elke sleutel werkt precies één keer.</div>
  </div>

  <div class="panel">
    <h2>Gebruikers</h2>
    <table>
      <thead><tr><th>E-mail</th><th>Rol</th><th>Status</th><th></th></tr></thead>
      <tbody id="userRows"></tbody>
    </table>
  </div>
</div>

<script src="auth.js"></script>
<script>
  let me = null;

  function randomKey(){
    // e.g. "PF-7K2M-QX9D-4RTN"
    const seg = () => Math.random().toString(36).slice(2, 6).toUpperCase();
    return `PF-${seg()}-${seg()}-${seg()}`;
  }

  async function loadUsers(){
    const { data, error } = await supabase
      .from('profiles')
      .select('id, email, role, status')
      .order('email');
    const tbody = document.getElementById('userRows');
    if (error || !data){
      tbody.innerHTML = `<tr><td colspan="4" class="muted">Kon gebruikers niet laden.</td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(u => `
      <tr>
        <td>${u.email}${u.id === me.id ? ' <span class="muted">(jij)</span>' : ''}</td>
        <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role}</span></td>
        <td><span class="badge ${u.status === 'blocked' ? 'badge-blocked' : 'badge-active'}">${u.status}</span></td>
        <td>
          ${u.id === me.id ? '' : `<button class="toggle" data-id="${u.id}" data-status="${u.status}">
            ${u.status === 'blocked' ? 'Deblokkeren' : 'Blokkeren'}
          </button>`}
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('button.toggle').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const newStatus = btn.dataset.status === 'blocked' ? 'active' : 'blocked';
        btn.disabled = true;
        const { error } = await supabase.from('profiles').update({ status: newStatus }).eq('id', id);
        if (error) { alert('Bijwerken mislukt: ' + error.message); btn.disabled = false; return; }
        loadUsers();
      };
    });
  }

  document.getElementById('genBtn').onclick = async () => {
    const key = randomKey();
    const { error } = await supabase.from('registration_keys').insert({ key, created_by: me.id });
    const box = document.getElementById('newKeyBox');
    if (error) { box.innerHTML = `<span class="muted">Mislukt: ${error.message}</span>`; return; }
    box.innerHTML = `<span class="newkey">${key}</span>`;
  };

  (async () => {
    me = await requireAdmin();
    if (!me) return; // requireAdmin already redirected
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadUsers();
  })();
</script>
</body>
</html>
